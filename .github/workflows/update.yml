name: Update fixtures & calendar

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours during the tournament
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Rebuild fixtures + ics
        run: node scripts/build-ics.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "wc26-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Auto-update fixtures & calendar"; git push; }
