<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>World Cup 2026 Tracker</title>
  <meta name="theme-color" content="#10161f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WC 2026" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🏆 FIFA World Cup 2026 <span class="sub">June 11 – July 19 · USA, Canada &amp; Mexico</span></h1>
    <div class="status-bar">
      <span id="data-status"></span>
      <button id="refresh-btn" title="Fetch live scores from ESPN">⟳ Refresh live scores</button>
    </div>
    <nav>
      <button class="tab" data-view="schedule">📋 Schedule</button>
      <button class="tab" data-view="groups">🏟 Groups</button>
      <button class="tab" data-view="bracket">🧩 Bracket</button>
      <button class="tab" data-view="calendar">📅 Calendar</button>
    </nav>
  </header>
  <main id="view"></main>
  <div id="modal-root"></div>
  <script src="data.js"></script>
  <script src="fixtures.js"></script>
  <script src="app.js"></script>
</body>
</html>
